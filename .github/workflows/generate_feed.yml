name: Generate feed

on: schedule: - cron: '0 3 * * *' workflow_dispatch: {}

jobs: build: runs-on: ubuntu-latest steps: - name: Checkout uses: actions/checkout@v4 with: persist-credentials: true

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Convert CSV to YML
    run: |
      mkdir -p docs
      python3 convert_csv_to_yml.py feed_template.csv docs/feed.xml

  - name: Commit feed
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    run: |
      git config user.name "${GIT_AUTHOR_NAME}"
      git config user.email "${GIT_AUTHOR_EMAIL}"
      if git status --porcelain | grep -q "docs/feed.xml"; then
        git add docs/feed.xml
        git commit -m "Auto update feed.xml" || echo "nothing to commit"
        git push
      else
        echo "Nothing changed"
      fi
